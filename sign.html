<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="border: 5px solid rgb(147, 120, 223); background-color: rgb(147, 165, 245);">
    <div style="display: flex;
 justify-content: center;
 background-color: rgb(147, 120, 223);
 box-sizing: border-box;
 padding: 10px;">
      <strong><em> <h1>JOIN US</h1></em></strong>
    </div>
<div style="padding: 160px; text-align: center;   ">
        <form>
       <fieldset style="background-color: rgb(94, 198, 247); box-shadow: 5PX 5PX grey; border-radius: 50px;">
            <legend><h2><strong><em>enter your information here</em></strong></h2></legend>
            <h1>sign-up</h1>
        <label>username*<label><br>
        <input  style=" border-radius: 20px; height: 25px; width:200px ;" type="text"  placeholder="choose a username" pattern="[A-Z]+"  title="CAPITAL LETTERS ONLY" required /><br><br>
        <label>full name*</label><br>
        <input style="  border-radius: 20px;  height: 25px; width:200px ;" type="text"  placeholder="full name"  pattern="[A-Z]+" required minlength="3"    ><br><br>
        <label>Email*</label><br>
        <input  style="  border-radius: 20px;  height: 25px; width:200px ;" type="e-mail" placeholder="your.email@example.com" required ><br><br>
         <label>date of birth</label><br>
         <input  style="  border-radius: 20px;  height: 25px; width:200px ;" type="date"  required  ><br><br>
         <label>Mobile Number (optional)</label><br>
         <input style=" border-radius: 20px;   height: 25px; width:200px ;" type="tel" placeholder="+91 1234567890" pattern="{1-9}" required  ><br><br>
        
         <label>country*</label><br>
         <select style=" border-radius: 20px;   height: 25px; width:200px ;" required >
            <option>india</option>
            <option>pakistan</option>
            <option>china</option>
            <option>afganistan</option>
            <option>africa</option>
            <option>napal</option>
            <option>america</option>
            <option>japan</option>
            <option>luxembourg</option>
            <option>korea</option>
         </select>
         <br><br>
         <label>Password*</label><br>
         <input style=" border-radius: 20px;  height: 25px; width:200px ;" type="password" placeholder="create a password"  required  > <br><br>
         <label>confirm your password*</label><br>
         <input style="  border-radius: 20px; height: 25px; width:200px ;" type="password" placeholder="confirm yuor password"  required  ><br><br>
         <input type="hidden" >
         <label>give your file*</label><br>
         <input  style=" border-radius: 20px;  height: 25px; width:200px" type="file" required ><br>
         <label>i agree to the terms of service and privacy policy</label> <input style="height: 25px; width:200px ;" type="checkbox"  required>
          <br><br><button>submit</button> 
        </fieldset>
    </form>
</div>
</body>
</html>
